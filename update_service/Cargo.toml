[package]
name = "update_service"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
# serde = { version = "1.0.228", features = ["derive"] }
# serde_json = "1.0.149"
axum = { version = "0.8.9", features = ["ws"] }
sha2 = "0.11.0"
tar = "0.4"
tower-http = { version = "0.6.8", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true