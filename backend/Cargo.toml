[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0.0"
tokio-serial = "5.4.5"
async-stream = "0.3.6"
futures = "0.3.32"
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmp-serde = "1.3.1"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
regex = "1.12.3"
lazy_static = "1.5.0"
rustfft = "6.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = "0.4.1" 
gpiocdev = "0.8.0"
libc = "0.2"

# [profile.release]
# opt-level = 3
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = true